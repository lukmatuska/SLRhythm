<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Advanced Bitmap Editor</title>
<style>
  body { font-family: sans-serif; }
  #grid { display: grid; gap: 1px; margin: 10px 0; }
  .pixel { width: 16px; height: 16px; background: #eee; cursor: pointer; }
  .on { background: black; }
  textarea { width: 100%; height: 120px; }
  .tools button { margin-right: 5px; }
</style>
</head>
<body>

<h2>Advanced Bitmap Editor</h2>

Width: <input id="width" type="number" value="32">
Height: <input id="height" type="number" value="32">
<button onclick="createGrid()">Create Grid</button>

<br><br>
<input type="file" id="pngInput" accept="image/png">
<button onclick="importPNG()">Import PNG</button>
Threshold: <input id="threshold" type="number" value="128" min="0" max="255">

<div class="tools">
  Tool:
  <button onclick="setTool('draw')">Draw</button>
  <button onclick="setTool('erase')">Erase</button>
  <button onclick="setTool('line')">Line</button>
  <button onclick="setTool('fill')">Fill</button>
</div>

<div id="grid"></div>

<button onclick="exportData()">Export</button>
<button onclick="importData()">Import C Array</button>

<h3>C Array:</h3>
<textarea id="io"></textarea>

<canvas id="hiddenCanvas" style="display:none"></canvas>

<script>
let pixels = [];
let width = 32;
let height = 32;
let tool = 'draw';
let startPoint = null;

function setTool(t) { tool = t; }

function createGrid() {
  width = parseInt(document.getElementById('width').value);
  height = parseInt(document.getElementById('height').value);

  const grid = document.getElementById('grid');
  grid.style.gridTemplateColumns = `repeat(${width}, 16px)`;
  grid.innerHTML = '';

  pixels = [];

  for (let y = 0; y < height; y++) {
    pixels[y] = [];
    for (let x = 0; x < width; x++) {
      pixels[y][x] = 0;

      const div = document.createElement('div');
      div.className = 'pixel';
      div.onmousedown = () => handleClick(x, y);
      grid.appendChild(div);
    }
  }
}

function redraw() {
  const grid = document.getElementById('grid');
  let i = 0;
  for (let y = 0; y < height; y++) {
    for (let x = 0; x < width; x++) {
      grid.children[i].classList.toggle('on', pixels[y][x]);
      i++;
    }
  }
}

function handleClick(x, y) {
  if (tool === 'draw') pixels[y][x] = 1;
  else if (tool === 'erase') pixels[y][x] = 0;
  else if (tool === 'line') {
    if (!startPoint) startPoint = {x, y};
    else {
      drawLine(startPoint.x, startPoint.y, x, y);
      startPoint = null;
    }
  }
  else if (tool === 'fill') floodFill(x, y, pixels[y][x]);

  redraw();
}

function drawLine(x0, y0, x1, y1) {
  let dx = Math.abs(x1 - x0);
  let dy = Math.abs(y1 - y0);
  let sx = x0 < x1 ? 1 : -1;
  let sy = y0 < y1 ? 1 : -1;
  let err = dx - dy;

  while (true) {
    pixels[y0][x0] = 1;
    if (x0 === x1 && y0 === y1) break;
    let e2 = 2 * err;
    if (e2 > -dy) { err -= dy; x0 += sx; }
    if (e2 < dx) { err += dx; y0 += sy; }
  }
}

function floodFill(x, y, target) {
  let stack = [[x, y]];
  let replacement = target ? 0 : 1;

  while (stack.length) {
    let [cx, cy] = stack.pop();
    if (cx < 0 || cy < 0 || cx >= width || cy >= height) continue;
    if (pixels[cy][cx] !== target) continue;

    pixels[cy][cx] = replacement;

    stack.push([cx+1, cy]);
    stack.push([cx-1, cy]);
    stack.push([cx, cy+1]);
    stack.push([cx, cy-1]);
  }
}

function exportData() {
  let bytesPerRow = Math.ceil(width / 8);
  let result = [];

  for (let y = 0; y < height; y++) {
    for (let b = 0; b < bytesPerRow; b++) {
      let byte = 0;
      for (let bit = 0; bit < 8; bit++) {
        let x = b * 8 + bit;
        if (x < width && pixels[y][x]) {
          byte |= (1 << (7 - bit));
        }
      }
      result.push(byte);
    }
  }

  document.getElementById('io').value =
    'static const uint8_t bitmap[] = {\n  ' +
    result.map(b => '0x' + b.toString(16).padStart(2,'0').toUpperCase()).join(', ') +
    '\n};';
}

function importData() {
  let text = document.getElementById('io').value;
  let matches = text.match(/0x[0-9a-fA-F]+/g);
  if (!matches) return;

  let bytes = matches.map(h => parseInt(h, 16));
  let bytesPerRow = Math.ceil(width / 8);

  let i = 0;
  for (let y = 0; y < height; y++) {
    for (let b = 0; b < bytesPerRow; b++) {
      let byte = bytes[i++] || 0;
      for (let bit = 0; bit < 8; bit++) {
        let x = b * 8 + bit;
        if (x < width) {
          pixels[y][x] = (byte >> (7 - bit)) & 1;
        }
      }
    }
  }

  redraw();
}

function importPNG() {
  const file = document.getElementById('pngInput').files[0];
  if (!file) return;

  const img = new Image();
  const reader = new FileReader();

  reader.onload = function(e) {
    img.onload = function() {
      const canvas = document.getElementById('hiddenCanvas');
      const ctx = canvas.getContext('2d');

      canvas.width = width;
      canvas.height = height;

      ctx.drawImage(img, 0, 0, width, height);

      const imageData = ctx.getImageData(0, 0, width, height);
      const data = imageData.data;

      const threshold = parseInt(document.getElementById('threshold').value);

      for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
          let i = (y * width + x) * 4;
          let r = data[i];
          let g = data[i+1];
          let b = data[i+2];

          let gray = (r + g + b) / 3;
          pixels[y][x] = gray < threshold ? 1 : 0;
        }
      }

      redraw();
    };

    img.src = e.target.result;
  };

  reader.readAsDataURL(file);
}

createGrid();
</script>

</body>
</html>
